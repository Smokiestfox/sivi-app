services:
  app:
    image: sivi-app:local
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_URL: ${SIVI_PUBLIC_URL:-http://localhost:1416}
      DATABASE_URL: ${SIVI_DOCKER_DATABASE_URL:-postgresql://sivi:sivi@postgres:5432/sivi}
      LAYA_URL: ${SIVI_DOCKER_LAYA_URL:-http://host.docker.internal:9002}
      STORAGE_DIR: /app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "1416:1416"
    volumes:
      - sivi_uploads:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:1416/api/health/db').then(r => { if (!r.ok) process.exitCode = 1 }).catch(() => { process.exitCode = 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sivi
      POSTGRES_PASSWORD: sivi
      POSTGRES_DB: sivi
    ports:
      - "5432:5432"
    volumes:
      - sivi_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sivi -d sivi"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai:
    build: ./ai-service
    profiles: ["legacy-ai"]
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sivi_postgres:
  sivi_uploads:
