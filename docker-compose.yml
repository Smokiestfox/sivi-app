services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sivi
      POSTGRES_PASSWORD: sivi
      POSTGRES_DB: sivi
    ports:
      - "5432:5432"
    volumes:
      - sivi_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sivi -d sivi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sivi_postgres:
